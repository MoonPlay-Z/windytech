services:
  - type: web
    name: windytech-web
    env: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: node dist/server/entry.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: windytech-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_SITE_URL
        value: https://www.windytech.studio
      - key: PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_NOTIFICACION_EMAIL
        sync: false

databases:
  - name: windytech-db
    databaseName: windytech
    user: windytech
    plan: starter
