services:
  - type: backend
    name: windytech-backend
    env: node
    plan: starter
    region: ohio
    buildCommand: npm ci
    startCommand: node backend/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_SITE_URL
        value: https://www.windytech.studio
      - key: PUBLIC_API_URL
        value: https://windytech-backend.onrender.com
      - key: PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_NOTIFICACION_EMAIL
        sync: false
      - key: DATABASE_URL
        fromEnvironment: NEON_DATABASE_URL

  # Neon database definition is added via dashboard or environment variables
databases: {}

# Neon PostgreSQL configuration
envVars:
  - name: NEON_DATABASE_URL
    fromSecret: neon_database_url
    sync: false