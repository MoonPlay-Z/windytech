services:
  - type: web
    name: windytech-web
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: node dist/server/entry.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_SITE_URL
        value: https://windytech.studio
      - key: SESSION_SECRET
        generateValue: true
      # Neon PostgreSQL: pega la cadena de conexión en el panel de Render.
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_NOTIFICACION_EMAIL
        sync: false
