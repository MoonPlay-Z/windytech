services:
  - type: web
    name: windytech-web
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: node dist/server/entry.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_SITE_URL
        value: https://windytech.studio
      - key: SESSION_SECRET
        generateValue: true
      # Neon PostgreSQL: pega la cadena de conexión en el panel de Render.
      - key: DATABASE_URL
        sync: false
      # Cloudinary (imágenes de productos, proyectos y publicaciones).
      # El nombre del cloud es público; la clave y el secret se pegan en el
      # panel de Render (Environment) para no guardarlos en el repositorio.
      - key: PUBLIC_CLOUDINARY_CLOUD_NAME
        value: cxy5wtgr
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_NOTIFICACION_EMAIL
        sync: false
      # eBay (Browse API + Selling API). Pega los valores en el panel de Render;
      # EBAY_REFRESH_TOKEN se obtiene con /api/ebay/callback.
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_DEV_ID
        sync: false
      - key: EBAY_REFRESH_TOKEN
        sync: false
      # Token manual solo para pruebas (caduca en ~2 h). Vacío en producción normal.
      - key: EBAY_ACCESS_TOKEN
        sync: false
      - key: EBAY_SANDBOX
        value: "true"
      - key: EBAY_REDIRECT_URI
        sync: false
      - key: EBAY_OAUTH_SCOPE
        value: https://api.ebay.com/oauth/api_scope/sell.item

  # Actualiza la tasa BCV cada día (12:00 UTC). Sin esto, el catálogo y el
  # carrito muestran una tasa vieja.
  - type: cron
    name: windytech-tasa-bcv
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci
    schedule: "0 12 * * *"
    startCommand: "tsx scripts/cron/update-rate.mjs"
    envVars:
      - key: DATABASE_URL
        sync: false
