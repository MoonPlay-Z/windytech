services:
  - type: web
    name: windytech-web
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: node dist/server/entry.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_SITE_URL
        value: https://windytech.studio
      - key: SESSION_SECRET
        generateValue: true
      # Neon PostgreSQL: pega la cadena de conexión en el panel de Render.
      - key: DATABASE_URL
        sync: false
      # Cloudinary (imágenes de productos, proyectos y publicaciones).
      # El nombre del cloud es público; la clave y el secret se pegan en el
      # panel de Render (Environment) para no guardarlos en el repositorio.
      - key: PUBLIC_CLOUDINARY_CLOUD_NAME
        value: cxy5wtgr
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ADMIN_NOTIFICACION_EMAIL
        sync: false

  # Actualiza la tasa BCV cada día (12:00 UTC). Sin esto, el catálogo y el
  # carrito muestran una tasa vieja.
  - type: cron
    name: windytech-tasa-bcv
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci
    schedule: "0 12 * * *"
    startCommand: "tsx scripts/cron/update-rate.mjs"
    envVars:
      - key: DATABASE_URL
        sync: false
